<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastrar usuário</h1>

    <form action="/register_user" method="POST">

        <label for="username">Usuário</label>
        <br>
        <input
            type="text"
            name="username"
            placeholder="Usuário"
            required
        >

        <br><br>

        <label for="email">E-mail</label>
        <br>
        <input
            type="email"
            name="email"
            placeholder="E-mail"
            required
        >

        <br><br>

        <label for="password">Senha</label>
        <br>
        <input
            type="password"
            name="password"
            placeholder="Senha"
            required
        >

        <br><br>

        <label for="confirm_password">Confirmar senha</label>
        <br>
        <input
            type="password"
            name="confirm_password"
            placeholder="Digite novamente sua senha"
            required
        >

        <br><br>

        {% if erro %}

            <p class="erro">

                {{ erro }}

            </p>

        {% endif %}

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <br>

    <a href="/">
        Voltar para login
    </a>

</body>
</html>
