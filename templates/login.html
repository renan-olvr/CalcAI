<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

     <!-- Faz a página se adaptar a dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- Título exibido na aba do navegador -->
    <title>Login</title>

    <!-- Importa o arquivo CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>
    <!-- Container principal da tela de login. Será estilizado pelo CSS -->
    <div class="login-container">

        <!-- Título da página -->
        <h1>Login</h1>

        <!--    Formulário.
            
                action="/login" significa que ao clicar no botão, os dados serão enviados para a rota 
        -->
        <form action="/login" method="POST">

            <input
                type="text"
                name="username"
                placeholder="Usuário ou email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>


        <!-- MENSAGEM DE ERRO -->

        {% if erro %}

            <p class="erro">

                {{ erro }}

            </p>

        {% endif %}

        <!-- Link para a tela de cadastro. -->

        <div class="cadastro-container">

            <span>
                Ainda não tem conta?
            </span>

            <a href="/register" class="register-link">
                Cadastre-se
            </a>

        </div>

        <!-- Link para entrar sem cadastro. -->

        <div class="guest-container">

            <span>ou</span>

            <a href="/index" class="guest-link">
                Entrar sem cadastro
            </a>

        </div>


    </div>

</body>
</html>
