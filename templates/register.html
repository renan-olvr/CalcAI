<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastrar usuário</h1>

    <form action="/register_user" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Usuário"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Senha"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <br>

    <a href="/">
        Voltar para login
    </a>

</body>
</html>
